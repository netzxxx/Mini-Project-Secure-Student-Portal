<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand small">
        <span class="brand-mark">SP</span>
        <span>Student Portal</span>
    </div>
    <span id="build-badge" class="badge hidden"></span>
    <div class="who">
        <span id="who-name"></span>
        <span id="who-role" class="role-pill"></span>
        <button id="logout" class="btn ghost" type="button">Log out</button>
    </div>
</header>

<nav class="tabs" id="tabs">
    <button class="tab" data-tab="grades" data-roles="STUDENT">My grades</button>
    <button class="tab" data-tab="courses" data-roles="TEACHER ADMIN">Courses</button>
    <!-- The Admin tab is only HIDDEN for other roles. This is UI convenience, not security:
         the server must still check the role on every /api/admin request. -->
    <button class="tab" data-tab="admin" data-roles="ADMIN">Admin</button>
    <button class="tab" data-tab="profile" data-roles="STUDENT TEACHER ADMIN">Profile</button>
</nav>

<main class="content">
    <p id="flash" class="flash hidden" role="status"></p>

    <section id="tab-grades" class="panel hidden">
        <h2>My grades</h2>
        <div class="stats" id="grade-stats"></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Course</th><th>Teacher</th><th>Midterm</th><th>Final</th><th>Total</th><th>Letter</th><th>Comment</th></tr>
                </thead>
                <tbody id="grades-body"></tbody>
            </table>
        </div>
    </section>

    <section id="tab-courses" class="panel hidden">
        <h2>Courses</h2>
        <div id="courses-list"></div>
        <aside id="contact-card" class="card hidden"></aside>
    </section>

    <section id="tab-admin" class="panel hidden">
        <h2>Users and roles</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Group</th><th>Role</th><th></th></tr></thead>
                <tbody id="users-body"></tbody>
            </table>
        </div>
        <h2>Security audit log</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Outcome</th><th>IP</th></tr></thead>
                <tbody id="audit-body"></tbody>
            </table>
        </div>
    </section>

    <section id="tab-profile" class="panel hidden">
        <h2>My profile</h2>
        <dl class="facts" id="profile-facts"></dl>
        <form id="profile-form" class="card" novalidate>
            <label for="p-fullName">Full name</label>
            <input id="p-fullName" maxlength="80" required>
            <label for="p-email">Email</label>
            <input id="p-email" type="email" maxlength="80">
            <label for="p-phone">Phone</label>
            <input id="p-phone" maxlength="20">
            <button type="submit" class="btn primary">Save</button>
        </form>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
