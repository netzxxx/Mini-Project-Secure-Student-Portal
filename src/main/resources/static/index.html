<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Secure Student Portal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b4cde'/%3E%3Crect x='11' y='6' width='10' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='15' width='16' height='11' rx='3' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body class="login-page">
<aside class="login-hero">
    <p class="wordmark">Secure Student Portal</p>
    <div class="hero-body">
        <h1>One pass.<br>Only your doors.</h1>
        <p class="hero-lead">Students see their own grades, teachers see their own courses, and the server checks every request.</p>
    </div>
    <div class="lanyard"><section id="pass" class="pass role-none" aria-label="Campus pass preview" aria-live="polite"></section></div>
    <p class="hero-note">Narxoz University, Mobile and Web Application Security</p>
</aside>

<main class="login-main">
    <div class="login-bar">
        <span id="build-badge" class="badge hidden"></span>
        <button id="theme-toggle" class="btn ghost small" type="button">Dark theme</button>
    </div>
    <div class="login-form-wrap">
        <h2 class="login-title">Sign in</h2>
        <form id="login-form" autocomplete="off" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" required maxlength="64" autocomplete="username">

            <label for="password">Password</label>
            <div class="field-with-action">
                <input id="password" name="password" type="password" required maxlength="128"
                       autocomplete="current-password">
                <button id="show-password" class="field-action" type="button" aria-label="Show password">Show</button>
            </div>

            <p id="login-error" class="error hidden" role="alert"></p>
            <button id="login-submit" type="submit" class="btn primary">Sign in</button>
        </form>

        <section class="demo-accounts">
            <h3>Demo accounts</h3>
            <p class="muted">Made-up data, local use only. Click one to fill in the form.</p>
            <div class="chips">
                <button type="button" class="chip role-student" data-user="student_a" data-pass="Student#2026" data-name="Aliya Student" data-role="STUDENT">student_a</button>
                <button type="button" class="chip role-student" data-user="student_b" data-pass="Student#2026" data-name="Bolat Student" data-role="STUDENT">student_b</button>
                <button type="button" class="chip role-student" data-user="student_c" data-pass="Student#2026" data-name="Dana Student" data-role="STUDENT">student_c</button>
                <button type="button" class="chip role-teacher" data-user="teacher_timur" data-pass="Teacher#2026" data-name="Timur Teacher" data-role="TEACHER">teacher_timur</button>
                <button type="button" class="chip role-teacher" data-user="teacher_saule" data-pass="Teacher#2026" data-name="Saule Teacher" data-role="TEACHER">teacher_saule</button>
                <button type="button" class="chip role-admin" data-user="admin" data-pass="Admin#2026" data-name="Portal Admin" data-role="ADMIN">admin</button>
            </div>
        </section>
    </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/pass.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
