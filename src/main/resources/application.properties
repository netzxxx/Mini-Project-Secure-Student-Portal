spring.application.name=secure-student-portal
app.build-label=v1-vulnerable
server.port=${PORT:8080}
# Listen on localhost only by default (the vulnerable build must stay local)
server.address=${SERVER_ADDRESS:127.0.0.1}

# In-memory demo database, recreated with made-up data on every start
spring.datasource.url=jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT signing key. Set JWT_SECRET in the environment; the default is for local demos only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=60

# ---------------------------------------------------------------
# VULNERABLE (Test 6): security misconfiguration
#   - the H2 database console is enabled and open to everyone
#   - error responses contain the exception class, message and full stack trace
# ---------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true
