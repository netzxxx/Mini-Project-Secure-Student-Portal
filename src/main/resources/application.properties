spring.application.name=secure-student-portal
app.build-label=v2-fixed
server.port=${PORT:8080}
# Listen on localhost only by default (the vulnerable build must stay local)
server.address=${SERVER_ADDRESS:127.0.0.1}

# In-memory demo database, recreated with made-up data on every start
spring.datasource.url=jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT signing key. Set JWT_SECRET in the environment; the default is for local demos only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=60

# FIX (Test 5): lock a username for 5 minutes after 5 wrong passwords
app.login.max-attempts=5
app.login.lock-seconds=300

# ---------------------------------------------------------------
# FIX (Test 6): security misconfiguration
#   - the H2 database console is switched off
#   - error responses are generic: no exception class, message or stack trace
#     (details stay in the server log only)
# ---------------------------------------------------------------
spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
