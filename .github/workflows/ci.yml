name: CI - build, tests and security scans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run JUnit tests
        run: mvn -B verify   # Maven preinstalled on the runner (avoids a wrapper download)
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/secure-student-portal-1.0.0.jar

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (Java, OWASP Top 10, secrets)
        run: semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --error --metrics=off
        continue-on-error: true   # report only; findings are reviewed by the team

  sca:
    name: SCA - Trivy (dependencies, secrets, Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (official Docker image)
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --offline-scan --exit-code 0 /src

  dast:
    name: DAST - OWASP ZAP baseline
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Start the app on localhost
        run: |
          nohup java -jar secure-student-portal-1.0.0.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/info && break; sleep 2; done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
